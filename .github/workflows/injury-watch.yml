name: Injury watch

# 3시간마다 5대 리그 부상 뉴스를 모아, 선수 이름이 확인된 새 소식만 텔레그램으로 알리고,
# docs/injuries/ 에 재활 콘텐츠 초안을 저장합니다.
# 수동 실행: GitHub 저장소 → Actions → "Injury watch" → "Run workflow"
#
# 저장소 Settings → Secrets and variables → Actions 에 넣는 값 (모두 선택):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  — 새 부상 소식 알림 (CHAT_ID는 쉼표로 여러 개 가능: 그룹,개인)
#   ANTHROPIC_API_KEY                      — 선수·부위·기간 추출 정확도 향상 (별도 결제, Max 플랜과 무관)
# Variables 탭: INJURY_WATCH_MODEL — 추출 모델 (비우면 claude-opus-5-5)
#   API_FOOTBALL_KEY                       — 구조화된 부상 데이터 (유료 플랜 필요할 수 있음)
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "테스트 알림만 보내기 (true면 뉴스 수집 없이 샘플 1건 발송)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: injury-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Anthropic SDK
        run: pip install --quiet anthropic
      - name: Collect, extract, alert, report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          INJURY_WATCH_MODEL: ${{ vars.INJURY_WATCH_MODEL }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python tools/injury_watch/injury_watch.py --test-alert
          else
            python tools/injury_watch/injury_watch.py
          fi
      - name: Commit report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/injuries
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Injury watch: $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
